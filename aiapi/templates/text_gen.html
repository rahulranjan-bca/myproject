<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI text Query</title>
</head>
<body>
    <div class="conatiner">
        <h1>AI Text Query</h1>
        <form action="{%url 'text_generator'%}" method="post">
           {%csrf_token%}
            <label for="prompt">Enter Prompt</label>
            <textarea name="prompt" id="prompt" class="form-control">

            </textarea>
            <input type="submit" value="Send" class="form-control">
        </form>
        <div class="card">
            <h2>Response</h2>
            {%if reponse %}
            {{reponse}}
            {%endif%}
        </div>
    </div>
</body>
</html>
